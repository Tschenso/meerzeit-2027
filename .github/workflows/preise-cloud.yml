name: Preise in der Cloud aktualisieren
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meerzeit-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Preisquellen ohne Datenänderung prüfen
        run: node scripts/preise-aktualisieren.cjs --dry-run --limit=1
