name: Preise in der Cloud aktualisieren
on:
  schedule:
    - cron: '0 9 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      nur_pruefen:
        description: Nur einen begrenzten Abruf testen, ohne Preise zu speichern
        type: boolean
        default: false
      offene_quellen:
        description: Nur bisher unbestätigte unterstützte Quellen erneut prüfen
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: meerzeit-cloud-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Preisquellen ohne Datenänderung prüfen
        if: inputs.nur_pruefen
        run: node scripts/preise-aktualisieren.cjs --source=cloud --dry-run --limit=1
      - name: Aktuelle Kabinenpreise und Preisverläufe abrufen
        if: ${{ !inputs.nur_pruefen }}
        env:
          PENDING_ONLY: ${{ inputs.offene_quellen }}
        run: |
          if [ "$PENDING_ONLY" = 'true' ]; then
            node scripts/preise-aktualisieren.cjs --source=cloud --pending-only
          else
            node scripts/preise-aktualisieren.cjs --source=cloud
          fi
      - name: Daten und Preisverlauf prüfen
        run: |
          node pruefen.cjs
          node scripts/preise-pruefen.cjs
      - name: Geprüfte Preisstände versionieren
        if: ${{ !inputs.nur_pruefen }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data.js mein-schiff.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update cruise prices and price history from cloud'
            git push origin HEAD:main
          fi
      - name: Abrufbericht
        if: ${{ !inputs.nur_pruefen }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),p=require('./scripts/preise-aktualisieren.cjs');
          let report='## Preisaktualisierung\n\nErgebnisse dieses Abrufs (Quellen):\n\nReederei | Bestätigt | Abruffehler | Manuell zu prüfen\n--- | ---: | ---: | ---:\n';
          for(const [file,key,name] of [['data.js','AIDA2027','AIDA'],['mein-schiff.js','MEINSCHIFF2027','Mein Schiff']]){
            const d=p.readData(file,key),r=d.lastUpdate;report+=`${name}${r.partial?' (Nachabruf)':''} | ${r.ok} | ${r.errors} | ${r.manual}\n`;
          }
          report+='\nGesamter Katalog (Reisen):\n\nReederei | Automatisch geprüft | Mit buchbaren Kabinenpreisen | Nicht buchbar / ausgebucht\n--- | ---: | ---: | ---:\n';
          for(const [file,key,name] of [['data.js','AIDA2027','AIDA'],['mein-schiff.js','MEINSCHIFF2027','Mein Schiff']]){const c=p.readData(file,key).priceCoverage;report+=`${name} | ${c.confirmed} / ${c.trips} | ${c.withPrices} | ${c.unavailable}\n`;}
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,report+'\n[Öffentliches Dashboard](https://tschenso.github.io/meerzeit-2027/)\n');
          NODE
  publish:
    needs: update
    if: ${{ !inputs.nur_pruefen }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
