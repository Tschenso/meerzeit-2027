name: Dashboard veröffentlichen und Preise aktualisieren
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preise_aktualisieren:
        description: Aktuelle Preise abrufen und den Verlauf fortschreiben
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: meerzeit-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Preise abrufen
        if: github.event_name == 'workflow_dispatch' && inputs.preise_aktualisieren
        run: node scripts/preise-aktualisieren.cjs
      - name: Daten und Preisverlauf prüfen
        run: |
          node pruefen.cjs
          node scripts/preise-pruefen.cjs
      - name: Neue Preisstände versionieren
        if: github.event_name == 'workflow_dispatch' && inputs.preise_aktualisieren
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js mein-schiff.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update cruise prices and price history'
            git push origin HEAD:main
          fi
      - name: Webpaket erstellen
        run: node scripts/build-pages.cjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
